name: Mobile
on:
  pull_request:
    paths: ['expo/**', 'lite/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['expo/**', 'lite/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        app: [expo, lite]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            expo/package-lock.json
            lite/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
        working-directory: expo
      - if: matrix.app == 'lite'
        run: npm ci --no-audit --no-fund
        working-directory: lite
      - run: npx tsc --noEmit
        working-directory: ${{ matrix.app }}
      - run: npm test
        working-directory: expo
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npx expo prebuild --platform android --no-install
        working-directory: ${{ matrix.app }}
      - run: ./gradlew --no-daemon --max-workers=2 :expenser-bank-notifications:testDebugUnitTest :app:assembleDebug
        working-directory: ${{ matrix.app }}/android

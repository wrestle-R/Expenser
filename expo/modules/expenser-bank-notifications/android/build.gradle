plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.expenserbanknotifications'
version = '0.1.0'

android {
  namespace "expo.modules.expenserbanknotifications"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Expo SDK 54 can autolink this module from its bundled Maven publication.
  implementation(findProject(':expo-background-task') ?: 'host.exp.exponent:expo.modules.backgroundtask:1.0.10')
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  testImplementation 'junit:junit:4.13.2'
}
